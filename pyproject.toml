[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-redsys"
version = "2.0.0"
description = "A simple, lightweight client to handle payments through the RedSys platform."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "David Díaz", email = "d.diazp@gmail.com" }]
keywords = ["redsys", "sermepa", "tpv", "payments", "psd2"]
dependencies = ["cryptography>=49", "pydantic>=2.13"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/ddiazpinto/python-redsys"
Source = "https://github.com/ddiazpinto/python-redsys"

[project.optional-dependencies]
# 0.26 is the oldest httpx that imports on Python 3.13 and later.
http = ["httpx>=0.26"]

[dependency-groups]
test = ["pytest>=8.4", "pytest-cov"]
lint = ["ruff", "mypy"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    # filelock releases with the 2026 security fixes need Python 3.11; pre-commit pulls it in.
    "pre-commit; python_version >= '3.11'",
]

[tool.setuptools.packages.find]
include = ["redsys*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
redsys = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.report]
fail_under = 95

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["build/"]
