name: Live

# Runs the opt-in tests against RedSys's test environment with its public test merchant.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[test,http]"
      - name: Live tests
        env:
          REDSYS_LIVE: "1"
        run: pytest -q tests/test_live.py
