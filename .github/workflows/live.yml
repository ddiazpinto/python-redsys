name: Live

# Runs the opt-in tests against RedSys's test environment with its public test merchant.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ">=0.13.4" # eMudhra CA incident fix
      - name: Install (locked)
        run: uv sync --locked --no-default-groups --group test --extra http
      - name: Live tests
        env:
          REDSYS_LIVE: "1"
        run: uv run --no-sync pytest -q tests/test_live.py
