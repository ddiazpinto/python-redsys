name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ">=0.13.4" # eMudhra CA incident fix
      - name: Lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked --no-default-groups --group lint
      - name: Ruff
        run: uv run --no-sync ruff check redsys tests
      - name: Ruff format
        run: uv run --no-sync ruff format --check redsys tests
      - name: Mypy
        run: uv run --no-sync mypy redsys

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ">=0.13.4" # eMudhra CA incident fix
      - name: Install (locked)
        run: uv sync --locked --no-default-groups --group test --extra http --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --no-sync pytest -q --cov=redsys --cov-report=xml tests/
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          # Empty on fork pull requests, where Codecov accepts a tokenless upload for public repositories.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The declared minimums are what users may resolve to; prove them on the oldest and newest Python.
  lowest-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ">=0.13.4" # eMudhra CA incident fix
      - name: Test with the lowest declared versions
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --resolution lowest-direct --with-editable ".[http]" --with "pytest>=8.4"
          pytest -q tests/
