# Install once with:  uv sync && uv run pre-commit install
# The hooks run the tools from the project environment, so versions match uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy redsys
        language: system
        types: [python]
        pass_filenames: false
