# Install once with:  pip install -e ".[dev]" && pre-commit install
# The ruff/mypy hooks use the locally installed tools so versions match the dev env.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: mypy redsys
        language: system
        types: [python]
        pass_filenames: false
